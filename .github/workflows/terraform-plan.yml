# Terraform Plan — MANUAL ONLY
# Runs only via manual dispatch (Actions tab -> "Terraform Plan (manual)" -> Run workflow).
#
# Plan review for the release apply is OWNER-LOCAL (`terraform plan` before the
# release `terraform apply`). The automated plan gate is OFF pull requests:
#   - PR gate removed: `terraform plan` on PRs was unreliable (stale GCS state
#     lock, then a hang caused by the required input var `project_id` never being
#     set in CI with no `-input=false` — Terraform blocked on the interactive
#     stdin prompt, runner stdin never EOFs) and added noise without blocking
#     value — the release apply is owner-driven and already preceded by an
#     owner-local plan.
#   - NOT on push-to-main: `terraform-apply.yml` triggers on the same
#     `push -> main` with the same `terraform/**` path, so a plan-on-main would
#     run CONCURRENTLY with the apply and race for the shared GCS state lock.
#     Plan (fast) starts before/during the apply, not after it, so it would show
#     pre-apply drift or fail red on lock contention — and could delay/fail the
#     release apply if it won the lock first.
# Trigger it manually whenever an on-CI plan is wanted (e.g. a post-release
# drift check). The job below keeps the same secrets/env wiring as the apply.

name: Terraform Plan (manual)

on:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_TF_SA_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_TOKEN }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}

      - name: Terraform Plan
        # `project_id` is a required input var; it is NOT set in CI and without
        # `-input=false` Terraform blocks on the interactive stdin prompt forever
        # (runner stdin never EOFs) -> hangs the job. Set the var via TF_VAR_ and
        # fail fast with -input=false. -lock-timeout=5m avoids blocking forever on
        # a stale state lock.
        run: terraform plan -no-color -input=false -lock-timeout=5m
        working-directory: terraform/
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_TF_SA_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_TOKEN }}
          TF_VAR_project_id: pinyin-pal-831
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
