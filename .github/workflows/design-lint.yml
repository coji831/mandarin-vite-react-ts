# Design Lint — spec-validity gate (canonical gate #8, Tier-2) wiring.
#
# Canonical command (single source: .github/instructions/project-workflow.
# instructions.md quality-gate table, row #8): `npm run design:lint`
#   -> tools/design-lint.mjs (strict wrapper around `@google/design.md lint
#      DESIGN.md`).
#
# Wired 2026-09-10 (S0b-1, branch ui/page-anatomy-convergence). DESIGN.md is the
# frozen agent-read design truth (4-layer enforcement model, layer 1); any PR/
# push that touches it must keep the token SPEC valid. This is the DESIGN.md-only
# spec gate — it deliberately does NOT run the source-code compliance audit
# (gate #9, `npm run design-audit`, Tier-2 backlog: 267 pre-existing errors incl.
# the intentional 15 page-anatomy deviations that ARE the S2 wave list).
#
# STRICT semantics (verified against @google/design.md v0.3.0, 2026-09-10):
#   • Upstream `lint` exits non-zero only on `error`-severity findings; the
#     `tools/design-lint.mjs` wrapper fails on ANY finding (errors + warnings +
#     infos) so a spec regression can never pass silently.
#   • S0b-1 restructure: DESIGN.md frontmatter is `name`/`description`/`tokens`
#     only — the 40-entry `components:` catalog moved to the body `## Component
#     Catalog` table (it was a design.md token-group mismatch -> 120 warnings).
#     Lint is 0/0/0 today; any regression goes red.
#   • Coverage note: @google/design.md value-validates TOP-LEVEL token groups
#     only; PinyinPal's tokens nest under `tokens:` and are protected by the
#     DESIGN.md <-> globals.css parity gate (separate). This workflow guards the
#     frontmatter STRUCTURE/shape.
#
# Trigger: DESIGN.md changes (plus the tool pin and this workflow file). Uses
# storybook-checks.yml conventions (actions v7, Node 24, npm cache).

name: Design Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "DESIGN.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/design-lint.yml"
  push:
    branches: [main]
    paths:
      - "DESIGN.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/design-lint.yml"

jobs:
  design-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Design lint (spec validity)
        run: npm run design:lint
