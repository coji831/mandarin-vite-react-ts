# ── CI Quality Gates ─────────────────────────────────────────────────────────
# Runs the repo's canonical quality gates (lint, type-check/build, full tests)
# on PRs to main and pushes to main, scoped to code changes. Story tests + CSS
# lint stay in storybook-checks.yml; visual regression in chromatic.yml; the PR
# preview smoke in preview.yml.
#
# Wired (canonical table: .github/instructions/project-workflow.instructions.md):
#   • Lint             → npm run lint        (gate #2, both)
#   • Type-check       → npm run typecheck   (gate #10, backend full)
#   • Type-check+build → npm run build       (gate #4, both — build IS the type-
#                                             check gate; frontend has no separate
#                                             typecheck script by design)
#   • Full tests       → npm run test:full   (gate #6, both)
#
# Deliberately NOT wired (why):
#   • Format (gate #1, `npm run format:check`) — not repo-green (836 pre-existing
#     prettier-drift files at HEAD, 2026-08-24); needs a standalone sweep first.
#   • `npm test` (Tier-1 changed scope) — `vitest run --changed` diffs working
#     tree vs local git base → 0 tests on a clean CI checkout, always green.
#     test:full is the reliable CI gate.
#   • Story tests + CSS lint (gates #3/#7) — already in storybook-checks.yml.
#   • Design audit (#9) / design lint (#8) — Tier-2, known pre-existing backlog.
#   • Chromatic visual regression / preview smoke — separate workflows.

name: CI Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # @prisma/client@7 has NO postinstall hook — after a clean `npm ci` the
      # generated client is gone and backend typecheck/build/tests fail until
      # `prisma generate` runs (mirrors apps/backend/railway.toml buildCommand).
      # Runs from apps/backend cwd so prisma.config.ts is found. `generate`
      # never connects, so a placeholder DATABASE_URL is safe.
      - name: Generate Prisma client (backend)
        run: npm run db:generate --workspace=@mandarin/backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint

      - name: Type-check (backend full)
        run: npm run typecheck

      - name: Type-check + build
        run: npm run build

      - name: Tests (full suite)
        run: npm run test:full
