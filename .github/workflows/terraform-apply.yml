# Terraform Apply
# Deploys infrastructure changes on push to main.

name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_TF_SA_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_TOKEN }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}

      - name: Terraform Apply
        # `project_id` is a required input var; it is NOT set in CI and without
        # `-input=false` Terraform blocks on the interactive stdin prompt forever
        # (runner stdin never EOFs) -> hangs the job. Set the var via TF_VAR_ and
        # fail fast with -input=false. -lock-timeout=5m avoids blocking forever on
        # a stale state lock.
        run: terraform apply -auto-approve -input=false -lock-timeout=5m
        working-directory: terraform/
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_TF_SA_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_TOKEN }}
          TF_VAR_project_id: pinyin-pal-831
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
