openapi: 3.1.0
info:
  title: Mandarin Learning Platform API
  version: 1.0.0
  description: |
    Production backend API for Mandarin vocabulary learning and AI-powered
    conversation generation. All endpoints are versioned under /api/v1.

    This reference documents the full NestJS 11 route surface: 54 route paths
    across the 15 backend modules (audio, auth, characters, chengyu,
    foundations, grammar, health, mnemonics, phonetic-clusters, progression,
    quiz, radicals, readers, review, words — pinyin lives under foundations).

    Authentication model (per route):
      - Public — no auth required (static reference data, health, auth
        register/login/refresh/logout).
      - Required auth — `Authorization: Bearer <access_token>`; user-scoped
        state or AI/vendor-cost generation (`RequireAuthGuard`).
      - Optional auth — bearer token is best-effort (`OptionalAuthGuard`): an
        absent or invalid token proceeds as a guest (`req.userId` undefined),
        never 401. Guest responses are session-local/empty shapes.

    All 4xx/5xx errors use the `{ code, message, requestId }` envelope.
  contact:
    name: API Support

servers:
  - url: http://localhost:3001/api
    description: Development server
  - url: https://mandarin-vite-react-ts-production.up.railway.app/api
    description: Production server (Railway)

tags:
  - name: System
    description: Health and system monitoring
  - name: Authentication
    description: User authentication and session management
  - name: TTS
    description: Text-to-speech synthesis (audio module)
  - name: Progression
    description: Phase gates, foundation and radical progress tracking
  - name: Quiz
    description: Quiz config, questions, attempts, and AI feedback
  - name: Review
    description: Spaced-repetition review items and ratings
  - name: Radicals
    description: Radical reference data
  - name: Foundations
    description: Pinyin, tones, and strokes reference data
  - name: Characters
    description: Character detail, decomposition, phonetic, and homophone data
  - name: Words
    description: Word detail and measure words
  - name: Mnemonics
    description: AI-generated and user-edited mnemonic stories
  - name: Phonetic Clusters
    description: Phonetic cluster reference data
  - name: Pinyin
    description: Pinyin search
  - name: Grammar
    description: Grammar pattern reference data
  - name: Chengyu
    description: Chengyu (four-character idiom) reference data
  - name: Readers
    description: Reading passages, sessions, and bookmarks

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token for authenticated requests
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HTTP-only refresh token cookie

  schemas:
    ErrorEnvelope:
      type: object
      description: |
        Standard error envelope — the global 24-3 `AppExceptionFilter`
        serializes every thrown `HttpException` into this shape.
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
        requestId:
          type: string
          description: Request ID (echoes the `X-Request-Id` response header)
      required:
        - code
        - message
        - requestId

    SuccessEnvelope:
      type: object
      description: Standard success wrapper used by the auth endpoints
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        message:
          type: string
          nullable: true
      required:
        - success

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          description: Process uptime in seconds
        services:
          type: object
          properties:
            gemini:
              type: boolean
              description: Gemini API reachable
            tts:
              type: boolean
              description: TTS service healthy
        cache:
          type: object
          properties:
            redis:
              type: object
              properties:
                connected:
                  type: boolean
      required:
        - status
        - timestamp
        - uptime
        - services
        - cache

paths:
  # ══════════════════════════════════════════════════════════════════
  # System — health
  # ══════════════════════════════════════════════════════════════════
  /v1/health:
    get:
      summary: Health check endpoint
      tags:
        - System
      description: |
        Returns operational status of backend services and external
        dependencies (Gemini, TTS, Redis). Public — no authentication.
      responses:
        "200":
          description: System is operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Health check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ══════════════════════════════════════════════════════════════════
  # Authentication — auth
  # ══════════════════════════════════════════════════════════════════
  /v1/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      description: |
        Creates a new user account with email and password. Public. Sets the
        httpOnly `refreshToken` cookie (7-day, Secure in production).
        Rate-limited by the brute-force limiter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  description: At least 8 chars with upper/lowercase and a number
                displayName:
                  type: string
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      accessToken:
                        type: string
        "400":
          description: Missing fields (MISSING_FIELDS) or weak password (INVALID_PASSWORD)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: User already exists (USER_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      description: |
        Authenticates a user and returns JWT tokens. Public. Sets the httpOnly
        `refreshToken` cookie. Rate-limited (5 attempts/minute/IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      accessToken:
                        type: string
        "400":
          description: Missing fields (MISSING_FIELDS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid credentials (INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      security:
        - cookieAuth: []
      description: |
        Rotates the refresh token (read from the httpOnly `refreshToken`
        cookie) and issues a new access token. Public — matches Express.
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
        "400":
          description: Refresh token missing (MISSING_TOKEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid or expired refresh token (INVALID_TOKEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      security:
        - cookieAuth: []
      description: |
        Invalidates the refresh token and clears the httpOnly `refreshToken`
        cookie. Public — matches Express.
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged out successfully
        "400":
          description: Refresh token missing (MISSING_REFRESH_TOKEN; cookie still cleared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/me:
    get:
      summary: Get current user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      description: Returns the authenticated user's profile (required auth).
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found (USER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ══════════════════════════════════════════════════════════════════
  # TTS — audio
  # ══════════════════════════════════════════════════════════════════
  /v1/tts:
    post:
      summary: Generate text-to-speech audio
      tags:
        - TTS
      description: |
        Resolves a browser-playable TTS audio URL for the given Hanzi text.
        Optional auth: guests get cache-first free reads (a GCS cache hit
        re-signs a fresh 1-hour URL with `cached: true` and no billable
        generation); a valid token attaches the user. Results are cached for
        24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Chinese text to synthesize
                  example: 你好
                voice:
                  type: string
                  description: TTS voice identifier (defaults to config voiceDefault)
                  default: cmn-CN-Wavenet-B
                  example: cmn-CN-Wavenet-B
      responses:
        "200":
          description: Audio URL resolved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - audioUrl
                  - cached
                properties:
                  audioUrl:
                    type: string
                    description: Short-lived (1h) signed GCS URL to the MP3 audio file
                    example: https://storage.googleapis.com/bucket/tts/abc123.mp3
                  cached:
                    type: boolean
                    description: true = MP3 already existed in GCS; false = freshly synthesized
        "400":
          description: Validation error — text is required (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: TTS generation or GCS upload failed (TTS_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ══════════════════════════════════════════════════════════════════
  # Progression
  # ══════════════════════════════════════════════════════════════════
  /v1/progression/foundation-progress:
    get:
      summary: Get foundation section progress
      tags:
        - Progression
      description: |
        Fetches the user's foundation section progress (auto-initializes four
        records when none exist). Optional auth — a guest receives `[]`.
      responses:
        "200":
          description: Foundation progress records (empty array for guests)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "500":
          description: Failed to fetch foundation progress (LOAD_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/progression/foundation-progress/{sectionId}:
    put:
      summary: Mark a foundation section completed
      tags:
        - Progression
      security:
        - bearerAuth: []
      description: Marks a foundation section as completed (required auth).
      parameters:
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
          description: Foundation section identifier
      responses:
        "200":
          description: Updated progress record
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid sectionId (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to mark section completed (UPDATE_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/progression/phase-gate:
    get:
      summary: Get phase gate status
      tags:
        - Progression
      description: |
        Fetches the user's phase gate status (auto-creates with defaults when
        none exists). Optional auth — a guest receives the calibrated guest
        gate (`currentPhase: 1, isGuest: true`).
      responses:
        "200":
          description: Phase gate object
          content:
            application/json:
              schema:
                type: object
        "500":
          description: Failed to fetch phase gate (LOAD_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      summary: Update phase gate progression
      tags:
        - Progression
      security:
        - bearerAuth: []
      description: Updates phase gate progression after a quiz attempt (required auth).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                phase:
                  type: number
                passed:
                  type: boolean
                gateCriteria:
                  type: string
      responses:
        "200":
          description: Updated phase gate object
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to update phase gate (UPDATE_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/progression/gates:
    get:
      summary: Get computed gate statuses
      tags:
        - Progression
      description: |
        Fetches COMPUTED gate statuses (Phase 2 IME, character count >= 500,
        Phase 3→4 comprehension). Optional auth — a CALIBRATED guest is
        Phase-1-only, so the Phase 2+ gates are not passed.
      responses:
        "200":
          description: Computed gate statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  phase2Gate:
                    type: object
                  characterCountGate:
                    type: object
                  phase3To4Gate:
                    type: object
        "500":
          description: Failed to load gate status (LOAD_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/progression/radical-progress:
    get:
      summary: Get radical progress
      tags:
        - Progression
      description: |
        Fetches the user's radical progress records. Optional auth — a guest
        receives `[]`.
      responses:
        "200":
          description: Radical progress records (empty array for guests)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "500":
          description: Failed to load radical progress (LOAD_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/progression/radical-progress/{radicalId}:
    put:
      summary: Create or update radical progress
      tags:
        - Progression
      security:
        - bearerAuth: []
      description: |
        Creates or updates radical progress. When `memorized: true`, a
        ReviewItem side-effect is fired (required auth).
      parameters:
        - name: radicalId
          in: path
          required: true
          schema:
            type: string
          description: Radical business key (e.g. rad_XXXX)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                memorized:
                  type: boolean
                recognitionLevel:
                  type: number
      responses:
        "200":
          description: Updated progress record
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid radicalId (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to update radical progress (UPDATE_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ══════════════════════════════════════════════════════════════════
  # Quiz
  # ══════════════════════════════════════════════════════════════════
  /v1/quiz/config:
    get:
      summary: Get quiz config
      tags:
        - Quiz
      description: |
        Fetches config for one quiz type, or all registered strategies when no
        type is given. Optional auth — public strategy metadata.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Quiz strategy type
      responses:
        "200":
          description: Quiz config object(s)
          content:
            application/json:
              schema:
                type: object
        "500":
          description: Failed to get quiz config (LOAD_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/quiz/questions:
    get:
      summary: Generate quiz questions
      tags:
        - Quiz
      description: |
        Generates questions for a quiz type by delegating to the registered
        strategy. Optional auth — the strategy pool is shared/public content.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Quiz strategy type (default audio-to-pinyin-tone)
        - name: count
          in: query
          required: false
          schema:
            type: integer
          description: Number of questions (default 20)
      responses:
        "200":
          description: Generated questions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "500":
          description: Failed to generate questions (LOAD_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/quiz/attempts:
    get:
      summary: Get user's quiz attempts
      tags:
        - Quiz
      security:
        - bearerAuth: []
      description: Fetches a user's quiz attempts (required auth — a guest is rejected 401).
      responses:
        "200":
          description: Quiz attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to fetch quiz attempts (LOAD_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      summary: Create a quiz attempt
      tags:
        - Quiz
      description: |
        Creates a quiz attempt. Optional auth — a guest receives a
        session-local mock attempt (201, no persistence).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                quizType:
                  type: string
                phase:
                  type: number
                metadata:
                  type: object
                passageId:
                  type: string
      responses:
        "201":
          description: Quiz attempt created (guest mock or persisted attempt)
          content:
            application/json:
              schema:
                type: object
        "500":
          description: Failed to create quiz attempt (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/quiz/attempts/{id}/answers:
    post:
      summary: Submit an answer to a quiz attempt
      tags:
        - Quiz
      description: |
        Submits an answer to a quiz attempt. Optional auth — a guest receives a
        session-local mock answer (correctness computed locally, no
        persistence).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Quiz attempt ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                questionIndex:
                  type: integer
                pinyinInput:
                  type: string
                selectedTone:
                  type: integer
                correctPinyin:
                  type: string
                correctTone:
                  type: integer
                category:
                  type: string
      responses:
        "200":
          description: Answer result (guest mock or persisted answer)
          content:
            application/json:
              schema:
                type: object
        "500":
          description: Failed to submit answer (VALIDATION_ERROR / INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/quiz/attempts/{id}/complete:
    put:
      summary: Complete a quiz attempt
      tags:
        - Quiz
      description: |
        Completes a quiz attempt and evaluates it against the strategy's pass
        threshold. Optional auth — a guest receives a session-local mock
        completion (no pass signal, no persistence).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Quiz attempt ID
      responses:
        "200":
          description: Completion result (guest mock or persisted evaluation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalScore:
                    type: integer
                  maxScore:
                    type: integer
                  passed:
                    type: boolean
                  accuracy:
                    type: number
        "500":
          description: Failed to complete quiz attempt (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/quiz/feedback:
    post:
      summary: Generate AI feedback for an incorrect answer
      tags:
        - Quiz
      security:
        - bearerAuth: []
      description: |
        Generates an AI-powered explanation for an incorrect quiz answer via
        Gemini (required auth — AI/vendor-cost generation is registered-only).
        Rate-limited (10/min per user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wordId
                - userAnswer
                - correctAnswer
                - questionType
              properties:
                wordId:
                  type: string
                userAnswer:
                  type: string
                correctAnswer:
                  type: string
                questionType:
                  type: string
                  example: tone_audio
      responses:
        "200":
          description: AI-generated explanation
          content:
            application/json:
              schema:
                type: object
                properties:
                  explanation:
                    type: string
                  errorType:
                    type: string
                    example: ai_feedback
        "400":
          description: Missing required fields (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/quiz/sandhi-drill/questions:
    get:
      summary: Get sandhi drill questions
      tags:
        - Quiz
      description: |
        Returns an array of sandhi drill `DrillQuestion` objects. Optional auth
        — the strategy pool is shared/public content.
      parameters:
        - name: count
          in: query
          required: false
          schema:
            type: integer
