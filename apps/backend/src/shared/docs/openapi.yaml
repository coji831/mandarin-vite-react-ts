        "404":
          description: Character not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to get decomposition (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/characters/search:
    get:
      summary: Search characters (SHADOWED — returns 404 in practice)
      tags:
        - Characters
      description: |
        Searches characters by pinyin, tone filter, or HSK level. Declared on
        the characters controller AFTER `:glyph`.

        **Shadow note:** on the live route tree the foundations `:glyph` shadow
        matches `search` first, so this path returns 404
        `Character "search" not found`. The underlying 2xx search logic is
        covered by service unit tests; the full route activates only if the
        route order is reordered.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Pinyin search query
        - name: tone
          in: query
          required: false
          schema:
            type: integer
          description: Tone filter
        - name: hskLevel
          in: query
          required: false
          schema:
            type: integer
          description: HSK level filter
      responses:
        "200":
          description: Search results (only when the shadow is lifted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
        "404":
          description: Shadowed by the foundations :glyph route (practical behavior)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Validation error (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to search characters (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/characters/frequency:
    get:
      summary: Get characters by frequency (SHADOWED — returns 404 in practice)
      tags:
        - Characters
      description: |
        Returns characters ordered by frequency rank, optionally filtered by
        HSK tier. Declared on the characters controller AFTER `:glyph`.

        **Shadow note:** on the live route tree the foundations `:glyph` shadow
        matches `frequency` first, so this path returns 404
        `Character "frequency" not found`. The underlying 2xx frequency logic
        is covered by service unit tests.
      parameters:
        - name: tier
          in: query
          required: false
          schema:
            type: integer
          description: HSK tier filter (1-6)
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: Page number (default 1)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
          description: Page size (default 50)
      responses:
        "200":
          description: Frequency list (only when the shadow is lifted)
          content:
            application/json:
              schema:
                type: array
        "404":
          description: Shadowed by the foundations :glyph route (practical behavior)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Invalid tier parameter (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to get frequency list (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

