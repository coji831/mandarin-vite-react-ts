openapi: 3.1.0
info:
  title: Mandarin Learning Platform API
  version: 1.0.0
  description: |
    Production backend API for Mandarin vocabulary learning and AI-powered conversation generation. 
    All endpoints are versioned under /api/v1. 
    Authentication required for AI services (TTS) to control API costs.
  contact:
    name: API Support

servers:
  - url: http://localhost:3001/api
    description: Development server
  - url: https://mandarin-vite-react-ts-production.up.railway.app/api
    description: Production server (Railway)

tags:
  - name: System
    description: Health and system monitoring
  - name: Authentication
    description: User authentication and session management
  - name: TTS
    description: Text-to-speech synthesis

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token for authenticated requests
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HTTP-only refresh token cookie

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
      required:
        - error

paths:
  /v1/health:
    get:
      summary: Health check endpoint
      tags:
        - System
      description: Returns operational status of backend services and external dependencies
      responses:
        "200":
          description: System is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  mode:
                    type: string
                    example: real
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      gemini:
                        type: boolean
                      tts:
                        type: boolean
                  cache:
                    type: object
                    properties:
                      redis:
                        type: object
                        properties:
                          connected:
                            type: boolean
        "500":
          description: Health check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      description: Creates a new user account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                  accessToken:
                    type: string
        "400":
          description: Validation error or weak password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already exists
        "429":
          description: Rate limit exceeded

  /v1/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      description: Authenticates user and returns JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                  accessToken:
                    type: string
        "401":
          description: Invalid credentials
        "429":
          description: Rate limit exceeded

  /v1/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      description: Rotates refresh token and provides new access token
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          description: Invalid refresh token

  /v1/auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      description: Invalidates refresh token
      responses:
        "200":
          description: Logged out successfully

  /v1/auth/me:
    get:
      summary: Get current user
      tags:
        - Authentication
      security:
        - bearerAuth: []
      description: Returns authenticated user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
        "401":
          description: Unauthorized

  /v1/tts:
    post:
      summary: Generate text-to-speech audio
      tags:
        - TTS
      security:
        - bearerAuth: []
      description: |
        Synthesizes Chinese text to speech using Google Cloud TTS. 
        Results are cached for 24 hours to reduce API costs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: Chinese text to synthesize (1-15 words)
                  example: 你好
                voice:
                  type: string
                  description: Voice identifier
                  default: cmn-CN-Wavenet-B
                  example: cmn-CN-Wavenet-B
      responses:
        "200":
          description: Audio URL generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  audioUrl:
                    type: string
                    description: Public URL to MP3 audio file
                    example: https://storage.googleapis.com/bucket/tts/abc123.mp3
                  cached:
                    type: boolean
                    description: Whether result was served from cache
        "400":
          description: Validation error (empty text, too many words)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized (missing or invalid JWT)
        "500":
          description: TTS generation failed
