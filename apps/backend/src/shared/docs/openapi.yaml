      description: Gets a single idiom by its content_id business key (cy_XXXX). Public.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Chengyu business key (cy_XXXX)
      responses:
        "200":
          description: Chengyu idiom
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid idiom ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Idiom not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to load chengyu idiom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ══════════════════════════════════════════════════════════════════
  # Readers
  # ══════════════════════════════════════════════════════════════════
  /v1/readers/passages:
    get:
      summary: List reading passages
      tags:
        - Readers
      description: |
        Lists passages, optionally filtered by `?hskLevel=N`. Optional auth — a
        guest lists shared passages; an authenticated user's own generated
        passages are excluded by the service.
      parameters:
        - name: hskLevel
          in: query
          required: false
          schema:
            type: integer
          description: HSK level filter (1-6)
      responses:
        "200":
          description: Passage list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        "400":
          description: Invalid hskLevel (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to list passages (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/readers/passages/{id}:
    get:
      summary: Get a reading passage
      tags:
        - Readers
      description: |
        Gets a single passage with segmented result and HSK profile. Optional
        auth — a guest reads without a userId (no per-word known status).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Passage ID
      responses:
        "200":
          description: Passage with segments and HSK profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sentences:
                        type: array
                      segments:
                        type: array
                      hskProfile:
                        type: object
        "400":
          description: Missing passage ID (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Passage not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to get passage (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/readers/passages/{id}/audio:
    post:
      summary: Get passage audio URLs
      tags:
        - Readers
      description: |
        Gets audio URLs for all sentences in a passage via a two-tier fallback
        (GCS → on-demand TTS). Optional auth (calibrated F5): user and guest
        share identical audio access — a guest never 401s and gets cache-first
        free reads. Returns per-sentence source status — never 5xx for audio
        infra failures.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Passage ID
      responses:
        "200":
          description: Per-sentence audio sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "400":
          description: Missing passage ID (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Passage not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to get passage audio (LOAD_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/readers/generate:
    post:
      summary: Generate a reading passage
      tags:
        - Readers
      security:
        - bearerAuth: []
      description: |
        Generates a new passage on a given topic (required auth). Rate limited
        to 5/day per user (DB-backed UTC midnight reset).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - topic
              properties:
                topic:
                  type: string
                  maxLength: 100
                  description: Passage topic (non-empty, <= 100 chars)
      responses:
        "201":
          description: Generated passage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "400":
          description: Invalid topic (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Daily generation limit exceeded (RATE_LIMIT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Gemini generation/parsing failure (GENERATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate passage (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/readers/sessions/{passageId}:
    get:
      summary: Get or create a reading session
      tags:
        - Readers
      security:
        - bearerAuth: []
      description: |
        Gets or creates a reading session. Returns
        `{ currentSentence, isCompleted }`. Required auth — user-scoped reading
        progress.
      parameters:
        - name: passageId
          in: path
          required: true
          schema:
            type: string
          description: Passage ID
      responses:
        "200":
          description: Reading session state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      currentSentence:
                        type: integer
                      isCompleted:
                        type: boolean
        "400":
          description: Missing passage ID (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to get session (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      summary: Update reading position
      tags:
        - Readers
      security:
        - bearerAuth: []
      description: |
        Updates the reading position. Required auth — user-scoped reading
        progress.
      parameters:
        - name: passageId
          in: path
          required: true
          schema:
            type: string
          description: Passage ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentSentence
              properties:
                currentSentence:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Updated session state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      currentSentence:
                        type: integer
                      isCompleted:
                        type: boolean
        "400":
          description: Invalid body or missing passage ID (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to update session (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/readers/sessions/{passageId}/complete:
    post:
      summary: Complete a passage
      tags:
        - Readers
      security:
        - bearerAuth: []
      description: |
        Marks a passage as completed (idempotent). Returns `{ passageId }`.
        Required auth.
      parameters:
        - name: passageId
          in: path
          required: true
          schema:
            type: string
          description: Passage ID
      responses:
        "200":
          description: Completion acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      passageId:
                        type: string
        "400":
          description: Missing passage ID (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to complete passage (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/readers/bookmarks:
    get:
      summary: List bookmarked passages
      tags:
        - Readers
      security:
        - bearerAuth: []
      description: |
        Lists bookmarked passage IDs. Returns `{ bookmarks: string[] }`.
        Required auth.
      responses:
        "200":
          description: Bookmarked passage IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bookmarks:
                        type: array
                        items:
                          type: string
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to list bookmarks (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      summary: Add a bookmark
      tags:
        - Readers
      security:
        - bearerAuth: []
      description: Adds a bookmark for a passage. Required auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - passageId
              properties:
                passageId:
                  type: string
      responses:
        "201":
          description: Bookmark added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      passageId:
                        type: string
        "400":
          description: Invalid body (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to add bookmark (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/readers/bookmarks/by-passage/{passageId}:
    get:
      summary: Check if a passage is bookmarked
      tags:
        - Readers
      security:
        - bearerAuth: []
      description: Checks if a single passage is bookmarked. Required auth.
      parameters:
        - name: passageId
          in: path
          required: true
          schema:
            type: string
          description: Passage ID
      responses:
        "200":
          description: Bookmark status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isBookmarked:
                        type: boolean
        "400":
          description: Missing passage ID (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to check bookmark (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      summary: Remove a bookmark by passage
      tags:
        - Readers
      security:
        - bearerAuth: []
      description: Removes a bookmark by passage ID (idempotent). Required auth.
      parameters:
        - name: passageId
          in: path
          required: true
          schema:
            type: string
          description: Passage ID
      responses:
        "204":
          description: Bookmark removed — no content
        "400":
          description: Missing passage ID (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to remove bookmark (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
