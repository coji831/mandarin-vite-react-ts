          in: query
          required: false
          schema:
            type: string
        - name: theme
          in: query
          required: false
          schema:
            type: string
        - name: era
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Chengyu idioms
          content:
            application/json:
              schema:
