  # ══════════════════════════════════════════════════════════════════
  # Mnemonics
  # ══════════════════════════════════════════════════════════════════
  /v1/mnemonics/{character}:
    get:
      summary: Get a mnemonic story
      tags:
        - Mnemonics
      description: |
        Fetches a mnemonic story for a character via the 4-step lookup chain
        (user-edited → cache → DB(AI) → generate). Optional auth — a guest
        reads shared/cached stories (`req.userId` undefined, never 401; a guest
        never sees another user's edited story). "No mnemonic yet" returns
        `{ "mnemonic": null }`.
      parameters:
        - name: character
          in: path
          required: true
          schema:
            type: string
          description: Single Han character
      responses:
        "200":
          description: Mnemonic story (or null when none exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mnemonic:
                    type: object
                    nullable: true
        "400":
          description: Invalid character (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to fetch mnemonic story (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      summary: Generate a mnemonic story via AI
      tags:
        - Mnemonics
      security:
        - bearerAuth: []
      description: |
        Generates a new mnemonic story for a character via AI (required auth —
        guests never trigger vendor-cost AI generation).
      parameters:
        - name: character
          in: path
          required: true
          schema:
            type: string
          description: Single Han character
      responses:
        "201":
          description: Generated mnemonic story
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid character (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI generation service unavailable (SERVICE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate mnemonic story (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      summary: Update (edit) a mnemonic story
      tags:
        - Mnemonics
      security:
        - bearerAuth: []
      description: |
        Updates a user's mnemonic story (user-edited persistence is
        user-scoped; required auth). HTML tags are stripped from the story.
      parameters:
        - name: character
          in: path
          required: true
          schema:
            type: string
          description: Single Han character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - story
              properties:
                story:
                  type: string
                  maxLength: 1000
                  description: Mnemonic story text (non-empty, HTML stripped)
                radicalIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated mnemonic story
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid character or story (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to update mnemonic story (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      summary: Reset a mnemonic story
      tags:
        - Mnemonics
      security:
        - bearerAuth: []
      description: |
        Resets a user's mnemonic story (deletes the user-edited version;
        required auth).
      parameters:
        - name: character
          in: path
          required: true
          schema:
            type: string
          description: Single Han character
      responses:
        "204":
          description: Reset successful — no content
        "400":
          description: Invalid character (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to reset mnemonic story (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

