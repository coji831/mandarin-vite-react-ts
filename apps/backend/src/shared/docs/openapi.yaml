            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to load cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ══════════════════════════════════════════════════════════════════
  # Pinyin
  # ══════════════════════════════════════════════════════════════════
  /v1/pinyin/search:
    get:
      summary: Search characters by pinyin
      tags:
        - Pinyin
      description: |
        Searches characters by pinyin query. Public. Unlike the characters
        search, this route is NOT shadowed (the pinyin router registered only
        `/search`), so it returns a real 2xx.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Pinyin search query (required)
        - name: tone
          in: query
          required: false
          schema:
            type: integer
          description: Tone filter (1-5)
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: Page number (default 1)
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
          description: Page size (default 50)
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing q or invalid tone (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to search pinyin (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ══════════════════════════════════════════════════════════════════
  # Grammar
  # ══════════════════════════════════════════════════════════════════
  /v1/grammar/patterns:
    get:
      summary: List grammar patterns
      tags:
        - Grammar
      description: |
        Lists patterns with optional `search` / `hskLevel` / `phase` filters
        and `page` / `pageSize` pagination. Public.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: hskLevel
          in: query
          required: false
          schema:
            type: integer
        - name: phase
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Grammar patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to load grammar patterns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/grammar/patterns/{id}:
    get:
      summary: Get a grammar pattern by ID
      tags:
        - Grammar
      description: Gets a single pattern by its content_id business key (gr_XXXX). Public.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Grammar pattern business key (gr_XXXX)
      responses:
        "200":
          description: Grammar pattern
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid pattern ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Pattern not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to load grammar pattern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ══════════════════════════════════════════════════════════════════
  # Chengyu
