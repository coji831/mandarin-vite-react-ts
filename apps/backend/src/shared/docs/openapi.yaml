  # Review
  # ══════════════════════════════════════════════════════════════════
  /v1/review/items:
    get:
      summary: Get review items
      tags:
        - Review
      security:
        - bearerAuth: []
      description: |
        Fetches the authenticated user's review items. Required auth —
        user-scoped SRS reads.
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Source filter — due | recent | all (default due)
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Optional item-type prefix filter
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Result limit (default 20)
      responses:
        "200":
          description: Review items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to fetch review items (LOAD_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/review/result:
    post:
      summary: Record a review rating
      tags:
        - Review
      security:
        - bearerAuth: []
      description: |
        Records a rating (again/good/easy) for a review item and computes the
        next review date. Required auth — writes user-scoped SRS state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemType
                - itemId
                - rating
              properties:
                itemType:
                  type: string
                  description: e.g. radical, character, word
                itemId:
                  type: string
                rating:
                  type: string
                  enum:
                    - again
                    - good
                    - easy
      responses:
        "200":
          description: Next review date / updated item result
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid itemType or rating (MISSING_FIELDS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid JWT (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to record rating (UPDATE_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/review/due-count:
    get:
