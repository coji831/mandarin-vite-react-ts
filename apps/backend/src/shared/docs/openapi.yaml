  # ══════════════════════════════════════════════════════════════════
  # Characters
  # ══════════════════════════════════════════════════════════════════
  /v1/characters/{glyph}:
    get:
      summary: Get character by glyph
      tags:
        - Characters
      description: |
        Returns full character detail (pinyin, meanings, stroke count, radical,
        etc.). Public — no authentication.

        **Shadow note:** this path is served by the FOUNDATIONS module — the
        foundations router is mounted before the characters router, so its
        `characters/:glyph` handler captures every single-segment
        `GET /v1/characters/<x>` on the live route tree (shadowing the
        characters module's own `:glyph`, `/search`, and `/frequency`
        handlers). Unknown glyphs return 404 `Character "<glyph>" not found`.
      parameters:
        - name: glyph
          in: path
          required: true
          schema:
            type: string
          description: Single Chinese character glyph
      responses:
        "200":
          description: Character detail
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing glyph (VALIDATION_ERROR — HTTP-unreachable for single-segment paths)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Character not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to get character data (LOAD_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/characters/{glyph}/phonetic:
    get:
      summary: Get phonetic component
      tags:
        - Characters
      description: |
        Returns phonetic component info (glyph, pinyin, meaning). Public.
        Served by the characters module (not shadowed — multi-segment path).
      parameters:
        - name: glyph
          in: path
          required: true
          schema:
            type: string
          description: Single Chinese character glyph
      responses:
        "200":
          description: Phonetic component info
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid character glyph (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Character or phonetic component not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to get phonetic component (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/characters/{glyph}/homophones:
